name: DSL224Manager
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
targets:
  DSL224Manager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "إدارة الراوتر"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: "Dark"
        NSLocalNetworkUsageDescription: "مطلوب للاتصال براوتر D-Link على الشبكة المحلية."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
