name: DSL224Manager
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
targets:
  DSL224Manager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.DSL224Manager
    dependencies:
      - target: DSL224WidgetExtension
        embed: true
        codeSign: false

  DSL224WidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.DSL224Manager.Widget
