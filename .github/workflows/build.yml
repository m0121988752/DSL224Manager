name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application with Xcode
        run: |
          xcodebuild -project DSL224Manager.xcodeproj \
            -scheme DSL224Manager \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Application into IPA
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/DSL224Manager.app Payload/
          zip -qr DSL224Manager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSL224Manager-IPA
          path: DSL224Manager.ipa
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.1.${{ github.run_number }}"
          echo "Publishing iOS GitHub Release $TAG_NAME"
          gh release create "$TAG_NAME" \
            DSL224Manager.ipa \
            --title "DSL224Manager iOS $TAG_NAME" \
            --notes "### ما الجديد في هذا التحديث (What's New):
- حزمة DSL224Manager.ipa جاهزة للتثبيت المباشر عبر AltStore و SideStore و TrollStore
- دعم مستودع AltStore التلقائي (AltStore Source) للإشعارات الفورية والتحديث بضغطة زر
- دعم كامل لويدجت شاشة القفل والشاشة الرئيسية بدون أي رموز تعبيرية
- تحسين أداء كشط WebUI البديل والتعامل مع راوترات D-Link و Huawei"
